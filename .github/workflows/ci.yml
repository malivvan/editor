name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The go directive of go.mod is the version the module requires,
          # so CI follows it instead of pinning versions here that drift
          # apart from it.
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # `make demo` is the local convenience; CI drives `go` directly because
      # a runner image is not guaranteed to have make on PATH.
      - name: Build demo
        # `demo` is also a directory in the checkout, so the default output
        # name would collide with it. Build to a throwaway path under
        # runner.temp rather than `-o /dev/null`, which is the null device on
        # Unix only: on Windows the target has to be a real path.
        run: go build -o "${{ runner.temp }}/demo-build" ./demo

      - name: Test (no race)
        if: matrix.os != 'ubuntu-latest'
        run: go test -count=1 ./...

      - name: Test (with race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
